name: Trusted manual local CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - shell: pwsh
        run: |
          uv sync --locked --python 3.12 --extra browser --extra dev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --locked --extra browser --extra dev python -m ruff check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --locked --extra browser --extra dev python -m pytest -q --timeout=90
          exit $LASTEXITCODE
