[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "DouyinDownloader"
version = "0.4.0"
description = "Douyin batch downloader with no-watermark support"
readme = "README.md"
license = "MIT AND Apache-2.0 AND ISC"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "aiohttp>=3.9.0",
    # Douyin API requests with Chrome's TLS/HTTP2 fingerprint.
    "curl_cffi>=0.7",
    "pyyaml>=6.0.1",
    "gmssl>=3.2.2",
    # Comment thumbnails and JPEG motion photos.
    "pillow>=10.0",
    "pywebview>=6.0",
]

[project.optional-dependencies]
# Browser fallback (logged-in page channel), QR login and homepage screenshots.
browser = ["playwright>=1.40.0"]
dev = ["pytest>=9.0", "pytest-asyncio>=1.0", "pytest-timeout>=2.4", "ruff>=0.16", "build>=1.3", "setuptools==84.0.0", "wheel==0.46.3", "pip-audit>=2.9"]
build = ["pyinstaller>=6.22"]
all = ["DouyinDownloader[browser,dev,build]"]

[project.scripts]
DouyinDownloader = "cli.main:main"
douyin-dl = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "common*", "douyin*", "engine*", "gui*", "services*", "storage*"]

[tool.setuptools]
py-modules = ["desktop_app"]

[tool.setuptools.package-data]
gui = [
  "web/*.html",
  "web/*.js",
  "web/*.css",
  "web/creator/*.css",
  "web/creator/*.js",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
