  <script>
    (() => {
      const key = 'douyin-downloader-theme'
      let theme = 'light'
      try { const value = localStorage.getItem(key); theme = value === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : value === 'dark' ? 'dark' : 'light' } catch {}
      document.documentElement.dataset.theme = theme
      document.documentElement.toggleAttribute('dark', theme === 'dark')
      try { if (localStorage.getItem('douyin-downloader-sidebar') === 'collapsed') document.documentElement.dataset.sidebar = 'collapsed' } catch {}
      // The desktop window drops its native caption on Windows; app.js
      // removes this again if the backend reports it kept the native one.
      // pywebview's own API arrives later; WebView2's message port exists now.
      if (window.chrome && window.chrome.webview) document.documentElement.dataset.frame = 'custom'
    })()
  </script>
